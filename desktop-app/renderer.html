<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisionForge OS Desktop</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7fa;color:#152a38}.hidden{display:none!important}.shell{display:flex;min-height:100vh}.side{width:238px;background:#102d3d;color:#dbeaf0;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 24px;font-weight:900}.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#087fc7,#1261ff);display:grid;place-items:center;color:#fff}.nav button{width:100%;text-align:left;background:transparent;color:#bcd0d8;padding:12px 13px;margin:3px 0;border-radius:10px}.nav button.active,.nav button:hover{background:rgba(255,255,255,.09);color:#fff}.main{margin-left:238px;width:calc(100% - 238px)}.top{height:70px;background:#fff;border-bottom:1px solid #e3ebef;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.pill{padding:8px 12px;border-radius:999px;background:#edf8f1;color:#187448;font-weight:800;font-size:13px}.wrap{padding:30px;max-width:1450px}.hero{background:linear-gradient(135deg,#0f3045,#087fc7);border-radius:22px;padding:30px;color:#fff}.hero h1{margin:8px 0;font-size:34px}.muted{color:#d6e8ef;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:18px}.card,.panel{background:#fff;border:1px solid #e1e9ed;border-radius:17px;padding:20px}.card strong{font-size:28px;display:block;margin-top:6px}.panel{margin-top:18px}.panel h2{margin:0 0 15px}.kicker{font-size:11px;font-weight:900;letter-spacing:.12em;color:#087fc7}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{flex:1}.input{padding:11px 12px;border:1px solid #d6e1e6;border-radius:10px;width:100%}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#087fc7;color:#fff}.danger{background:#fff0f0;color:#b42318}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid #edf1f3;text-align:left;font-size:13px}.table th{color:#6b7c86}.statusdot{display:inline-flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#42c97b}.offline .dot{background:#d98c24}.modal{position:fixed;inset:0;background:rgba(9,27,38,.45);display:grid;place-items:center;padding:20px}.modalbox{background:#fff;border-radius:18px;padding:24px;width:min(560px,100%)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{font-size:12px;font-weight:800;color:#526773}.full{grid-column:1/-1}.notice{padding:12px;border-radius:10px;background:#fff8e7;color:#7a5a16;margin-top:12px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 9px;border-radius:999px;background:#eef5f8;font-size:12px;font-weight:800}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.back{background:#eef5f8;color:#294552}.subgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.mini{background:#f8fafb;border:1px solid #e5ecef;border-radius:12px;padding:14px}.mini strong{display:block;font-size:20px;margin-top:4px}@media(max-width:950px){.side{width:190px}.main{margin-left:190px;width:calc(100% - 190px)}.grid{grid-template-columns:1fr 1fr}} </style><style>

</head><body><div id="login" class="wrap" style="max-width:900px;margin:auto"><section class="hero"><div class="mark">VF</div><h1>VisionForge OS Desktop</h1><p class="muted">Conecte este aplicativo ao seu VisionForge OS. Depois do primeiro sincronismo, os dados ficam disponíveis localmente para continuidade de trabalho.</p></section><section class="panel"><h2>Conectar ao sistema</h2><div class="formgrid"><label class="full">Endereço do WordPress<input class="input" id="base" placeholder="https://seusite.com"></label><label>Usuário ou e-mail<input class="input" id="user"></label><label>Senha<input class="input" id="pass" type="password"></label></div><button class="btn primary" id="loginBtn" style="margin-top:14px">Entrar e sincronizar</button><div id="loginMsg"></div></section></div><div id="app" class="shell hidden"><aside class="side"><div class="brand"><div class="mark">VF</div><div>VISIONFORGE<br><small>OS Desktop</small></div><div class="account-footer"><b>Desktop 0.14.0</b><br>Conectado ao VisionForge OS</div></div><nav class="nav"><button data-view="dashboard" class="active">Dashboard</button><button data-view="clients">Clientes</button><button data-view="leads">Leads</button><button data-view="projects">Projetos</button><button data-view="tasks">Tarefas</button><button data-view="quotes">Orçamentos</button><button data-view="contracts">Contratos</button><button data-view="financial">Financeiro</button><button data-view="team">Equipe</button><button data-view="notifications">Notificações</button><button data-view="account">Minha conta</button></nav></aside><div class="main"><header class="top"><strong id="viewTitle">Dashboard</strong><span id="conn" class="pill"><span class="statusdot"><i class="dot"></i> Online</span></span></header><main class="wrap"><div id="content"></div></main></div></div><div id="modal" class="modal hidden"><div class="modalbox"><h2 id="modalTitle">Novo registro</h2><div id="modalFields" class="formgrid"></div><div id="modalFiles" class="notice hidden"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="saveBtn">Salvar</button></div></div></div><script>
const $=id=>document.getElementById(id);let current='dashboard';const labels={clients:'Clientes',leads:'Leads',projects:'Projetos',tasks:'Tarefas',quotes:'Orçamentos',contracts:'Contratos',financial:'Financeiro',team:'Equipe',notifications:'Notificações',account:'Minha conta'};const tableMap={clients:'clients',leads:'leads',projects:'projects',tasks:'tasks',quotes:'quotes',contracts:'contracts',financial:'financial'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function state(){return await window.vfosDesktop.state()}async function renderTeam(){try{const out=await window.vfosDesktop.team();$('content').innerHTML=`<section class="panel"><div class="detail-head"><div><span class="kicker">GESTÃO</span><h2>Equipe</h2><p>Usuários e grupos disponíveis para o seu acesso no VisionForge OS.</p></div><button class="btn back" onclick="render()">← Dashboard</button></div><h3>Usuários</h3><table class="table"><thead><tr><th>Nome</th><th>Login</th><th>E-mail</th><th>Perfil</th></tr></thead><tbody>${(out.users||[]).map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.login)}</td><td>${esc(u.email)}</td><td>${esc((u.roles||[]).join(', ')||'—')}</td></tr>`).join('')||'<tr><td colspan=4>Nenhum usuário disponível.</td></tr>'}</tbody></table><h3 style="margin-top:24px">Grupos</h3><div class="subgrid">${(out.groups||[]).map(g=>`<div class="mini"><b>${esc(g.name)}</b><small>${esc(g.description||'')}</small><strong>${Number(g.members_count||0)} membro(s)</strong></div>`).join('')||'<div class="notice">Nenhum grupo encontrado.</div>'}</div></section>`}catch(e){$('content').innerHTML=`<section class="panel"><h2>Equipe</h2><div class="notice">${esc(e.message)}</div></section>`}}async function renderNotifications(){try{const out=await window.vfosDesktop.notifications();const ns=out.notifications||[];$('content').innerHTML=`<section class="panel"><div class="detail-head"><div><span class="kicker">CENTRAL</span><h2>Notificações</h2><p>Mensagens e eventos recebidos no seu usuário do VisionForge OS.</p></div><button class="btn back" onclick="render()">← Dashboard</button></div>${ns.map(n=>`<article class="mini" style="margin-top:10px;${Number(n.is_read)?'opacity:.72':''}"><div style="display:flex;justify-content:space-between;gap:12px"><div><b>${esc(n.title)}</b><p style="margin:6px 0">${esc(n.message||'')}</p><small>${esc(n.module||'Sistema')} · ${esc(n.created_at||'')}</small></div>${Number(n.is_read)?'<span class="chip">Lida</span>':`<button class="btn primary" onclick="markNotification(${Number(n.id)})">Marcar como lida</button>`}</div></article>`).join('')||'<div class="notice">Você não possui novas notificações.</div>'}</section>`}catch(e){$('content').innerHTML=`<section class="panel"><h2>Notificações</h2><div class="notice">${esc(e.message)}</div></section>`}}async function markNotification(id){try{await window.vfosDesktop.notificationRead({id});await renderNotifications()}catch(e){alert(e.message)}}async function render(){const s=await state();if(!s.user)return;$('conn').innerHTML=`<span class="statusdot"><i class="dot"></i> ${navigator.onLine?'Online':'Offline'} · ${s.queued} pendente(s)</span>`;$('viewTitle').textContent=labels[current]||'Dashboard';if(current==='team'){await renderTeam();return}if(current==='notifications'){await renderNotifications();return}if(current==='account'){await renderAccount();return}if(current==='dashboard'){let counts={};for(const k of Object.keys(tableMap)){const r=await window.vfosDesktop.records({table:tableMap[k]});counts[k]=r.rows.length}$('content').innerHTML=`<section class="hero"><span class="kicker" style="color:#b9e8ff">VISIONFORGE OS DESKTOP</span><h1>Olá, ${esc(s.user.name.split(' ')[0])}.</h1><p class="muted">Seu ambiente está conectado ao mesmo VisionForge OS do WordPress. As operações compatíveis podem continuar localmente e entrarão na fila quando estiver sem internet.</p><button class="btn" onclick="doSync()">Sincronizar agora</button></section><div class="grid">${Object.entries(labels).slice(0,4).map(([k,v])=>`<div class="card"><span class="kicker">${v}</span><strong>${counts[k]||0}</strong><small>registros locais</small></div>`).join('')}</div><section class="panel"><h2>Sincronização e segurança</h2><p>Última sincronização: <b>${esc(s.lastSync||'—')}</b></p><p>Operações aguardando envio: <b>${s.queued}</b> · Arquivos pendentes: <b>${s.pendingFiles||0}</b> · Conflitos: <b>${s.conflicts||0}</b></p>${s.queued?'<div class="notice">Há alterações locais aguardando conexão com o WordPress.</div>':''}${s.conflicts?'<div class="notice">Existem conflitos que precisam ser revisados antes de concluir a sincronização.</div>':''}<button class="btn" style="margin-top:8px" onclick="showConflicts()">Revisar conflitos</button></section>`;return}await renderTable(current)}
async function renderTable(view,search=''){const table=tableMap[view];const out=await window.vfosDesktop.records({table,search});const rows=out.rows;const preferred=view==='clients'?['person_type','name','document','email','phone','whatsapp','status']:(view==='leads'?['name','company','stage','estimated_value','next_followup','probability']:view==='projects'?['name','client_id','status','priority','value','progress','due_date']:null);const cols=preferred?preferred.filter(k=>rows.some(r=>Object.prototype.hasOwnProperty.call(r,k))):[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(k=>!['id','created_at','updated_at'].includes(k)).slice(0,7);$('content').innerHTML=`<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><span class="kicker">${labels[view]}</span><h2 style="margin-top:5px">Dados locais</h2></div><button class="btn primary" onclick="openCreate('${view}')">+ Novo</button></div><div class="toolbar"><input class="input" id="search" placeholder="Pesquisar..." value="${esc(search)}"><button class="btn" onclick="renderTable('${view}',document.getElementById('search').value)">Pesquisar</button><button class="btn" onclick="doSync()">Sincronizar</button></div><table class="table"><thead><tr><th>ID</th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.id)}</td>${cols.map(c=>`<td>${esc(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])}</td>`).join('')}<td><div style="display:flex;gap:6px">${view==='projects'?`<button class="btn" onclick="openProject(${Number(r.id)})">Abrir</button>`:''}${view==='quotes'?`<button class="btn" onclick="openQuote(${Number(r.id)})">Abrir</button>`:''}${view==='contracts'?`<button class="btn" onclick="openContract(${Number(r.id)})">Abrir</button>`:''}<button class="btn" onclick="openEdit('${view}',${Number(r.id)})">Editar</button><button class="btn danger" onclick="removeRecord('${table}',${Number(r.id)})">Excluir</button></div></td></tr>`).join('')||'<tr><td colspan="8">Nenhum registro local encontrado.</td></tr>'}</tbody></table></section>`}
const fieldMap={
clients:[['person_type','Tipo de pessoa'],['name','Nome / Razão social'],['company','Empresa'],['legal_name','Razão social'],['trade_name','Nome fantasia'],['document','CPF/CNPJ'],['rg','RG'],['email','E-mail'],['billing_email','E-mail financeiro'],['phone','Telefone'],['whatsapp','WhatsApp'],['website','Site'],['birth_date','Data de nascimento'],['profession','Profissão'],['nationality','Nacionalidade'],['marital_status','Estado civil'],['state_registration','Inscrição estadual'],['municipal_registration','Inscrição municipal'],['address_zip','CEP'],['address_street','Rua / Avenida'],['address_number','Número'],['address_complement','Complemento'],['address_neighborhood','Bairro'],['address_city','Cidade'],['address_state','Estado'],['responsible_name','Responsável'],['responsible_role','Cargo do responsável'],['responsible_cpf','CPF do responsável'],['responsible_rg','RG do responsável'],['responsible_birth_date','Nascimento do responsável'],['responsible_email','E-mail do responsável'],['responsible_phone','Telefone do responsável'],['responsible_whatsapp','WhatsApp do responsável'],['responsible_nationality','Nacionalidade do responsável'],['responsible_marital_status','Estado civil do responsável'],['responsible_profession','Profissão do responsável'],['status','Status']],
leads:[['name','Nome'],['company','Empresa'],['email','E-mail'],['phone','Telefone'],['source','Origem'],['service_interest','Interesse'],['estimated_value','Valor estimado'],['stage','Etapa'],['probability','Probabilidade %'],['next_followup','Próximo contato'],['flow_quote_enabled','Criar orçamento no fluxo']],
projects:[['name','Nome do projeto'],['client_id','ID do cliente'],['service_id','ID do serviço'],['status','Status'],['priority','Prioridade'],['value','Valor'],['due_date','Prazo'],['progress','Progresso %'],['flow_create_financial','Criar financeiro']],
tasks:[['title','Título'],['description','Descrição'],['project_id','ID do projeto'],['client_id','ID do cliente'],['status','Status'],['priority','Prioridade'],['start_date','Início'],['due_date','Prazo'],['assigned_user_id','Responsável'],['estimated_hours','Horas estimadas']],
quotes:[['number','Número'],['title','Título'],['client_id','ID do cliente'],['lead_id','ID do lead'],['description','Descrição'],['subtotal','Subtotal'],['discount_type','Tipo de desconto'],['discount_value','Desconto'],['total','Total'],['payment_terms','Condições de pagamento'],['valid_until','Validade'],['status','Status'],['flow_create_contract','Criar contrato'],['flow_create_project','Criar projeto'],['flow_create_financial','Criar financeiro']],
contracts:[['title','Título'],['client_id','ID do cliente'],['status','Status']],
financial:[['description','Descrição'],['client_id','ID do cliente'],['amount','Valor'],['paid_amount','Valor recebido'],['status','Status'],['payment_method','Forma de pagamento']]
};function clientTypeToggle(){const el=document.querySelector('#modalFields [data-field=person_type]');if(!el)return;const sync=()=>{const pj=el.value==='pj';document.querySelectorAll('#modalFields [data-field]').forEach(input=>{const label=input.closest('label');if(!label)return;const key=input.dataset.field;const companyFields=['company','legal_name','trade_name','state_registration','municipal_registration','responsible_name','responsible_role','responsible_cpf','responsible_rg','responsible_birth_date','responsible_email','responsible_phone','responsible_whatsapp','responsible_nationality','responsible_marital_status','responsible_profession'];const pfFields=['rg','birth_date','profession','nationality','marital_status'];if(pj) label.style.display=pfFields.includes(key)?'none':'';else label.style.display=companyFields.includes(key)?'none':''})};el.addEventListener('change',sync);sync();}
async function showFiles(view,id){const box=$('modalFiles');if(!['clients','projects'].includes(view)||Number(id)<1){box.classList.add('hidden');return;}const out=await window.vfosDesktop.files({parent_table:tableMap[view],parent_id:id});box.classList.remove('hidden');box.innerHTML='<b>Arquivos</b><div style="margin-top:8px">'+(out.rows.length?out.rows.map(f=>`<div style="padding:6px 0">${esc(f.title)} — ${esc(f.status)}${f.remote_url?` · <a href="${esc(f.remote_url)}" target="_blank">abrir</a>`:''}${f.last_error?`<br><small>${esc(f.last_error)}</small>`:''}</div>`).join(''):'Nenhum arquivo local.')+'</div><button class="btn" style="margin-top:8px" onclick="attachFile(\'${view}\',${Number(id)})">+ Anexar arquivo</button>';}
async function attachFile(view,id){const f=await window.vfosDesktop.chooseFile();if(!f)return;await window.vfosDesktop.saveFile({client_file_id:f.client_file_id,parent_table:tableMap[view],parent_id:Number(id),local_path:f.local_path,original_name:f.original_name,title:f.original_name,mime_type:f.mime_type,size:f.size});await showFiles(view,id)}
function formFields(view,data={}){const fields=fieldMap[view]||[['title','Título'],['status','Status']];return fields.map(([k,l],i)=>{const wide=['description','notes','payment_terms'].includes(k)||(['clients'].includes(view)&&i>=18);const type=['birth_date','responsible_birth_date','next_followup','start_date','due_date','valid_until'].includes(k)?'date':(['estimated_value','probability','value','progress','subtotal','discount_value','total','amount','paid_amount','estimated_hours'].includes(k)?'number':'text');const val=esc(data[k]??'');return `<label class="${wide?'full':''}">${l}<input class="input" data-field="${k}" type="${type}" value="${val}"></label>`}).join('')+(!fields.some(x=>x[0]==='notes')?`<label class="full">Observação<textarea class="input" data-field="notes">${esc(data.notes??'')}</textarea></label>`:'')}function readModal(){const data={};document.querySelectorAll('#modalFields [data-field]').forEach(x=>data[x.dataset.field]=x.value);return data}function openCreate(view){const table=tableMap[view];$('modalTitle').textContent='Novo registro — '+labels[view];$('modalFields').innerHTML=formFields(view);$('modal').classList.remove('hidden');$('modalFiles').classList.add('hidden');clientTypeToggle();$('saveBtn').onclick=async()=>{await window.vfosDesktop.createRecord({table,data:readModal()});closeModal();await renderTable(view)}}async function openEdit(view,id){const table=tableMap[view];const out=await window.vfosDesktop.records({table});const row=out.rows.find(r=>Number(r.id)===Number(id));if(!row)return;$('modalTitle').textContent='Editar — '+labels[view];$('modalFields').innerHTML=formFields(view,row);$('modal').classList.remove('hidden');clientTypeToggle();showFiles(view,id);$('saveBtn').onclick=async()=>{await window.vfosDesktop.updateRecord({table,id,data:readModal()});closeModal();await renderTable(view)}}function closeModal(){$('modal').classList.add('hidden')}async function removeRecord(table,id){if(!confirm('Excluir este registro localmente e enviar a exclusão quando conectar?'))return;await window.vfosDesktop.deleteRecord({table,id});await renderTable(current)}async function doSync(){try{await window.vfosDesktop.sync();await render()}catch(e){$('conn').innerHTML='<span class="statusdot"><i class="dot"></i> Offline · aguardando conexão</span>'}}
async function runWorkflow(action,id){if(!navigator.onLine){alert('Esta ação precisa de internet para aplicar o fluxo no WordPress.');return null;}try{const out=await window.vfosDesktop.workflow({action,id});await window.vfosDesktop.sync();return out}catch(e){alert(e.message||'Não foi possível executar o fluxo.');return null;}}
async function openQuote(id){const out=await window.vfosDesktop.records({table:'quotes'});const q=out.rows.find(r=>Number(r.id)===Number(id));if(!q)return;const items=(await window.vfosDesktop.records({table:'quote_items'})).rows.filter(x=>Number(x.quote_id||0)===Number(id));const contracts=(await window.vfosDesktop.records({table:'contracts'})).rows.filter(x=>Number(x.quote_id||0)===Number(id));$('viewTitle').textContent='Orçamento';$('content').innerHTML=`<section class="panel"><div class="detail-head"><div><button class="btn back" onclick="renderTable('quotes')">← Orçamentos</button><span class="kicker" style="display:block;margin-top:18px">ORÇAMENTO ${esc(q.number||'')}</span><h2 style="margin:5px 0">${esc(q.title||'Orçamento')}</h2><div class="chips"><span class="chip">${esc(q.status||'draft')}</span><span class="chip">Total: R$ ${Number(q.total||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span></div></div><div><button class="btn primary" onclick="runWorkflow('quote_contract',${Number(id)}).then(()=>openQuote(${Number(id)}))">Gerar contrato</button><button class="btn" onclick="runWorkflow('quote_project',${Number(id)}).then(()=>openQuote(${Number(id)}))">Criar projeto</button><button class="btn" onclick="runWorkflow('quote_financial',${Number(id)}).then(()=>openQuote(${Number(id)}))">Criar financeiro</button></div></div><p>${esc(q.description||'')}</p><div class="subgrid"><div class="mini">Subtotal<strong>R$ ${Number(q.subtotal||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong></div><div class="mini">Desconto<strong>R$ ${Number(q.discount_amount||q.discount_value||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong></div><div class="mini">Validade<strong>${esc(q.valid_until||'—')}</strong></div></div></section><section class="panel"><h2>Itens</h2><table class="table"><thead><tr><th>Item</th><th>Qtd.</th><th>Valor unitário</th><th>Total</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.title)}</td><td>${esc(i.quantity)}</td><td>R$ ${Number(i.unit_price||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td><td>R$ ${Number(i.total||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td></tr>`).join('')||'<tr><td colspan="4">Nenhum item sincronizado.</td></tr>'}</tbody></table></section><section class="panel"><h2>Fluxo relacionado</h2><p>Contrato(s): <b>${contracts.length}</b> · Projeto: <b>${Number(q.converted_project_id||0)||'—'}</b> · Financeiro: <b>${Number(q.converted_financial_id||0)||'—'}</b></p></section>`}
async function openContract(id){const out=await window.vfosDesktop.records({table:'contracts'});const c=out.rows.find(r=>Number(r.id)===Number(id));if(!c)return;$('viewTitle').textContent='Contrato';$('content').innerHTML=`<section class="panel"><div class="detail-head"><div><button class="btn back" onclick="renderTable('contracts')">← Contratos</button><span class="kicker" style="display:block;margin-top:18px">CONTRATO ${esc(c.number||'')}</span><h2 style="margin:5px 0">${esc(c.title||'Contrato')}</h2><div class="chips"><span class="chip">${esc(c.status||'draft')}</span><span class="chip">Valor: R$ ${Number(c.value||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span></div></div><div><button class="btn primary" onclick="runWorkflow('contract_project',${Number(id)}).then(()=>openContract(${Number(id)}))">Criar projeto</button><button class="btn" onclick="runWorkflow('contract_financial',${Number(id)}).then(()=>openContract(${Number(id)}))">Criar financeiro</button></div></div><div class="panel" style="background:#fbfcfd"><b>Conteúdo</b><div style="margin-top:10px;line-height:1.7">${esc(c.content||'Ainda não há conteúdo preenchido neste contrato.')}</div></div><div class="subgrid"><div class="mini">Cliente<strong>${Number(c.client_id||0)||'—'}</strong></div><div class="mini">Projeto<strong>${Number(c.project_id||0)||'—'}</strong></div><div class="mini">Financeiro<strong>${Number(c.converted_financial_id||0)||'—'}</strong></div></div></section>`}
async function openProject(id){const out=await window.vfosDesktop.records({table:'projects'});const project=out.rows.find(r=>Number(r.id)===Number(id));if(!project)return;const tasks=await window.vfosDesktop.records({table:'tasks'});const related=tasks.rows.filter(t=>Number(t.project_id||0)===Number(id));const files=await window.vfosDesktop.files({parent_table:'projects',parent_id:Number(id)});current='projects';document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view==='projects'));$('viewTitle').textContent='Projeto';$('content').innerHTML=`<section class="panel"><div class="detail-head"><div><button class="btn back" onclick="renderTable('projects')">← Projetos</button><span class="kicker" style="display:block;margin-top:18px">PROJETO</span><h2 style="margin:5px 0">${esc(project.name||'Projeto')}</h2><div class="chips"><span class="chip">${esc(project.status||'')}</span><span class="chip">${esc(project.priority||'normal')}</span><span class="chip">${esc(project.progress||0)}% concluído</span></div></div><div><button class="btn" onclick="openEdit('projects',${Number(id)})">Editar projeto</button><button class="btn primary" onclick="openProjectTask(${Number(id)})">+ Nova tarefa</button></div></div><div class="subgrid"><div class="mini">Valor<strong>R$ ${Number(project.value||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong></div><div class="mini">Prazo<strong>${esc(project.due_date||'—')}</strong></div><div class="mini">Tarefas<strong>${related.length}</strong></div></div></section><section class="panel"><h2>Tarefas do projeto</h2><table class="table"><thead><tr><th>Título</th><th>Status</th><th>Prioridade</th><th>Prazo</th><th></th></tr></thead><tbody>${related.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(t.status)}</td><td>${esc(t.priority)}</td><td>${esc(t.due_date||'—')}</td><td><button class="btn" onclick="openEdit('tasks',${Number(t.id)})">Editar</button></td></tr>`).join('')||'<tr><td colspan=5>Nenhuma tarefa vinculada.</td></tr>'}</tbody></table></section><section class="panel"><h2>Arquivos</h2><p>Arquivos ficam disponíveis localmente e são enviados automaticamente quando houver conexão.</p><div>${files.rows.map(f=>`<div class="mini" style="margin-top:8px"><b>${esc(f.title)}</b><br><small>${esc(f.status)} · ${Number(f.size||0).toLocaleString('pt-BR')} bytes</small>${f.remote_url?` · <a href="${esc(f.remote_url)}" target="_blank">abrir no servidor</a>`:''}</div>`).join('')||'<div class="notice">Nenhum arquivo anexado.</div>'}</div><button class="btn" style="margin-top:10px" onclick="attachFile('projects',${Number(id)}).then(()=>openProject(${Number(id)}))">+ Anexar arquivo</button></section>`}async function openProjectTask(projectId){$('modalTitle').textContent='Nova tarefa do projeto';$('modalFields').innerHTML=formFields('tasks',{project_id:projectId});$('modal').classList.remove('hidden');$('modalFiles').classList.add('hidden');$('saveBtn').onclick=async()=>{await window.vfosDesktop.createRecord({table:'tasks',data:readModal()});closeModal();await openProject(projectId)}}async function showConflicts(){const list=await window.vfosDesktop.conflicts();$('content').innerHTML=`<section class="panel"><div class="detail-head"><div><span class="kicker">SINCRONIZAÇÃO</span><h2>Conflitos pendentes</h2><p>Escolha qual versão deve permanecer quando o mesmo registro foi alterado no servidor e no Desktop.</p></div><button class="btn back" onclick="render()">← Voltar</button></div>${list.map(c=>{let local={},server={};try{local=JSON.parse(c.local_json||'{}')}catch{}try{server=JSON.parse(c.server_json||'{}')}catch{}return `<div class="panel" style="margin-top:12px;background:#fbfcfd"><b>${esc(labels[c.table_name]||c.table_name)} #${Number(c.record_id)}</b><p>${esc(c.message||'Conflito detectado.')}</p><div class="subgrid"><div class="mini"><b>Desktop</b><pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify(local,null,2))}</pre></div><div class="mini"><b>Servidor</b><pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify(server,null,2))}</pre></div><div class="mini"><b>Ação</b><p>Servidor atualizado em ${esc(c.server_updated_at||'—')}</p><button class="btn" onclick="resolveConflict('${esc(c.client_op_id)}','server')">Manter servidor</button><button class="btn primary" onclick="resolveConflict('${esc(c.client_op_id)}','local')">Manter Desktop</button><button class="btn danger" onclick="resolveConflict('${esc(c.client_op_id)}','discard')">Descartar alteração</button></div></div></div>`}).join('')||'<div class="notice">Nenhum conflito pendente.</div>'}</section>`}async function resolveConflict(id,action){await window.vfosDesktop.resolveConflict({client_op_id:id,action});await showConflicts()}
$('loginBtn').onclick=async()=>{const m=$('loginMsg');m.textContent='Conectando...';try{await window.vfosDesktop.login({baseUrl:$('base').value.trim(),login:$('user').value.trim(),password:$('pass').value});$('login').classList.add('hidden');$('app').classList.remove('hidden');await render()}catch(e){m.textContent=e.message}};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.view;render()});window.addEventListener('online',render);window.addEventListener('offline',render);(async()=>{const s=await state();if(s.user){$('login').classList.add('hidden');$('app').classList.remove('hidden');await render()}})();

async function renderAccount(){try{const s=await state();const out=await window.vfosDesktop.permissions();const p=out.permissions||{};const names={'clients':'Clientes','crm':'CRM / Leads','projects':'Projetos','tasks':'Tarefas','quotes':'Orçamentos','contracts':'Contratos','financial':'Financeiro','team':'Equipe','notifications':'Notificações','ai':'Inteligência artificial'};const groups={};Object.entries(p).forEach(([k,v])=>{const g=k.split('.')[0];(groups[g]||(groups[g]=[])).push([k,v])});$('content').innerHTML=`<section class="panel"><div class="detail-head"><div><span class="kicker">CONTA</span><h2>${esc(s.user?.name||'Usuário')}</h2><p>${esc(s.user?.email||'')} · ${esc(s.user?.login||'')}</p></div><button class="btn danger" onclick="doLogout()">Sair do aplicativo</button></div><div class="subgrid"><div class="mini"><small>Servidor</small><strong style="font-size:16px">${esc(s.baseUrl||'—')}</strong></div><div class="mini"><small>Operações pendentes</small><strong>${s.queued}</strong></div><div class="mini"><small>Conflitos</small><strong>${s.conflicts}</strong></div></div></section><section class="panel"><h2>Permissões deste acesso</h2><p>As permissões abaixo são lidas do VisionForge OS. O Desktop não cria permissões próprias.</p><div class="subgrid">${Object.entries(groups).map(([g,items])=>`<div class="mini"><b>${esc(names[g]||g)}</b><div class="chips" style="margin-top:10px">${items.map(([k,v])=>`<span class="chip">${v?'✓':'×'} ${esc(k.split('.').slice(1).join(' ')||'acesso')}</span>`).join('')}</div></div>`).join('')}</div></section>`}catch(e){$('content').innerHTML=`<section class="panel"><h2>Minha conta</h2><div class="notice">${esc(e.message)}</div></section>`}}
async function doLogout(){if(!confirm('Deseja sair deste computador?'))return;try{await window.vfosDesktop.logout();$('app').classList.add('hidden');$('login').classList.remove('hidden');$('pass').value='';}catch(e){alert(e.message)}}
window.addEventListener('online',()=>{try{doSync()}catch(e){}});
window.addEventListener('offline',()=>{render().catch(()=>{})});
</script></body></html>
